  <rect width="128" height="128" rx="28" fill="#0a0a0c"/>

  <!-- Subtle accent ring -->
  <rect x="3" y="3" width="122" height="122" rx="26" fill="none" stroke="#3b82f6" stroke-opacity="0.20" stroke-width="1.5"/>

  <!-- Brand mark: one dit + one dah, centered, accent blue.
